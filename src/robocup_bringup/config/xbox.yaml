teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 9
    enable_turbo_button: -1
    publish_stamped_twist: true
    frame: base_link
    axis_linear:
      x: 1
      y: 0
    scale_linear:
      x: 0.8
      y: 0.25
    axis_angular:
      yaw: 2
    scale_angular:
      yaw: 0.6
